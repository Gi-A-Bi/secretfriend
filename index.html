<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>우리 반 비밀친구</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#EFE9FF; --ink:#2E2A4A; --muted:#726C97; --card:#FFFFFF;
    --violet:#6C5CE7; --violet-d:#5646d6; --marigold:#FFC145; --rose:#FF8FA3;
    --line:#E4DDFA; --ok:#3CB4A0; --danger:#E5568C;
    --display:'Gaegu', cursive; --body:'Noto Sans KR', sans-serif;
    --r:16px; --shadow:0 10px 30px rgba(76,60,160,.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:var(--body); color:var(--ink);
    background:radial-gradient(120% 100% at 50% 0%, #F7F2FF 0%, var(--bg) 60%);
    min-height:100vh; padding:20px 16px 48px;
    display:flex; justify-content:center; align-items:flex-start;
  }
  .app{width:100%; max-width:460px}
  .app.wide{max-width:760px}
  .hidden{display:none !important}
  h1,h2,h3{font-family:var(--display); font-weight:700; margin:0; line-height:1.15}
  .brand{font-family:var(--display); font-size:34px; text-align:center; color:var(--violet); margin-bottom:2px}
  .sub{text-align:center; color:var(--muted); font-size:15px; margin-bottom:22px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:20px; box-shadow:var(--shadow)}
  .card + .card{margin-top:14px}
  label{display:block; font-size:14px; font-weight:500; color:var(--muted); margin-bottom:6px}
  input, textarea{
    width:100%; font-family:var(--body); font-size:16px; color:var(--ink);
    border:1.5px solid var(--line); border-radius:12px; padding:13px 14px; background:#FDFCFF;
  }
  input:focus, textarea:focus{outline:none; border-color:var(--violet); box-shadow:0 0 0 3px rgba(108,92,231,.15)}
  textarea{resize:vertical; min-height:80px}
  .btn{
    font-family:var(--body); font-weight:700; font-size:16px; cursor:pointer;
    border:none; border-radius:14px; padding:14px 18px; width:100%;
    background:var(--violet); color:#fff; transition:transform .08s ease, background .15s ease;
  }
  .btn:hover{background:var(--violet-d)}
  .btn:active{transform:translateY(1px)}
  .btn.big{font-size:19px; padding:18px}
  .btn.ghost{background:#F1EDFF; color:var(--violet)}
  .btn.ghost:hover{background:#E7E0FF}
  .btn.soft{background:var(--marigold); color:#4a3a00}
  .btn.soft:hover{background:#f2b52e}
  .btn.line{background:transparent; color:var(--muted); border:1.5px solid var(--line)}
  .btn.line:hover{background:#faf8ff}
  .btn.mini{width:auto; padding:8px 14px; font-size:14px; border-radius:10px}
  .row{display:flex; gap:10px; flex-wrap:wrap}
  .row > *{flex:1}
  .stack > * + *{margin-top:12px}
  .link{background:none; border:none; color:var(--muted); font-size:14px; text-decoration:underline; cursor:pointer; font-family:var(--body); padding:8px}
  .msg{font-size:14px; margin-top:10px; min-height:18px}
  .msg.err{color:var(--danger)}
  .msg.ok{color:var(--ok)}
  .pill{display:inline-block; font-size:12px; font-weight:700; padding:3px 10px; border-radius:999px}
  .pill.on{background:#E4F7F2; color:#1c8a76}
  .pill.off{background:#FBE7EF; color:#c23a6b}
  .choice{display:grid; gap:14px}
  .choice .card{cursor:pointer; text-align:center; padding:26px 20px; transition:transform .1s ease, box-shadow .15s ease}
  .choice .card:hover{transform:translateY(-3px); box-shadow:0 16px 34px rgba(76,60,160,.18)}
  .choice .emoji{font-size:40px; display:block; margin-bottom:8px}
  .choice h2{font-size:26px}
  .choice p{color:var(--muted); font-size:14px; margin:6px 0 0}
  .note{
    position:relative; margin:6px auto 0; width:200px; height:150px; cursor:pointer;
    background:linear-gradient(160deg,#fff 0%,#F3EEFF 100%);
    border:2px dashed var(--violet); border-radius:18px;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    box-shadow:var(--shadow); user-select:none;
  }
  .note .seal{font-size:40px}
  .note .tap{font-family:var(--display); font-size:20px; color:var(--violet); margin-top:4px}
  .note.shake{animation:shake .12s linear infinite}
  @keyframes shake{
    0%{transform:translate(0,0) rotate(0)} 25%{transform:translate(-4px,2px) rotate(-2deg)}
    50%{transform:translate(3px,-3px) rotate(2deg)} 75%{transform:translate(-3px,3px) rotate(-1deg)}
    100%{transform:translate(0,0) rotate(0)}
  }
  .reveal-name{
    font-family:var(--display); font-size:46px; color:var(--violet); text-align:center;
    animation:pop .5s cubic-bezier(.2,1.4,.4,1) both;
  }
  @keyframes pop{0%{transform:scale(.3); opacity:0} 100%{transform:scale(1); opacity:1}}
  .suspense{font-family:var(--display); font-size:30px; color:var(--rose); text-align:center; letter-spacing:2px}
  .confetti{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:50}
  .confetti span{position:absolute; top:-30px; font-size:22px; animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg); opacity:0}}
  .mission{background:linear-gradient(160deg,#FFF7E4,#FFEFC9); border:1px solid #F3DDA0; border-radius:14px; padding:16px; margin-top:14px}
  .mission .text{font-family:var(--display); font-size:22px; margin-top:4px; color:#5a4410}
  .list{border:1px solid var(--line); border-radius:12px; overflow:hidden}
  .list .item{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px 14px; border-top:1px solid var(--line)}
  .list .item:first-child{border-top:none}
  .code{font-family:var(--display); font-size:22px; letter-spacing:1px; color:var(--violet)}
  .arrow{color:var(--muted)}
  .rank{font-family:var(--display); font-size:22px; width:26px; color:var(--marigold); text-align:center}
  .empty{color:var(--muted); font-size:14px; text-align:center; padding:14px}
  .backbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px}
  .seg{display:flex; gap:6px; background:#EAE3FC; border-radius:12px; padding:5px; margin-bottom:16px}
  .segbtn{flex:1; border:none; background:transparent; font-family:var(--body); font-weight:700; font-size:15px; color:var(--muted); padding:10px; border-radius:9px; cursor:pointer}
  .segbtn.on{background:#fff; color:var(--violet); box-shadow:0 2px 6px rgba(76,60,160,.12)}
  @media (prefers-reduced-motion: reduce){
    .note.shake{animation:none} .reveal-name{animation:none} .confetti{display:none}
  }
</style>
</head>
<body>
<div class="app" id="app">

  <div id="setup" class="hidden">
    <div class="brand">🔐 설정이 필요해요</div>
    <div class="card stack">
      <p style="margin:0; color:var(--muted); font-size:15px; line-height:1.6">
        이 파일을 편집기로 열어 아래 <b>&lt;script&gt;</b> 맨 위의 <b>firebaseConfig</b> 값을 채워 주세요.
        Firebase 콘솔 → 프로젝트 설정 → 내 앱(웹)에서 복사할 수 있어요.
      </p>
    </div>
  </div>

  <section id="landing" class="hidden">
    <div class="brand">🎁 우리 반 비밀친구</div>
    <p class="sub">몰래 챙겨주고, 마지막에 짠! 공개해요</p>
    <div class="choice">
      <div class="card" onclick="show('studentLogin')">
        <span class="emoji">🧒</span><h2>학생</h2>
        <p>내 코드로 들어가서 비밀친구를 뽑아요</p>
      </div>
      <div class="card" onclick="show('teacherLogin')">
        <span class="emoji">🧑‍🏫</span><h2>선생님</h2>
        <p>학급을 만들고 활동을 관리해요</p>
      </div>
    </div>
  </section>

  <section id="studentLogin" class="hidden">
    <div class="backbar"><button class="link" onclick="show('landing')">← 처음으로</button></div>
    <div class="brand">🧒 학생 입장</div>
    <p class="sub">선생님께 받은 코드를 입력하세요</p>
    <div class="card stack">
      <div>
        <label for="stCode">내 코드</label>
        <input id="stCode" placeholder="예) 호랑이07" autocomplete="off"
               style="font-family:var(--display); font-size:24px; letter-spacing:2px; text-align:center" />
      </div>
      <button class="btn big" onclick="studentLogin()">들어가기</button>
      <div id="stLoginMsg" class="msg err"></div>
    </div>
  </section>

  <section id="studentHome" class="hidden">
    <div class="backbar">
      <div><h2 id="stHello" style="font-size:24px"></h2></div>
      <button class="link" onclick="logoutStudent()">나가기</button>
    </div>
    <div id="stHomeBody" class="stack"></div>
  </section>

  <section id="teacherLogin" class="hidden">
    <div class="backbar"><button class="link" onclick="show('landing')">← 처음으로</button></div>
    <div class="brand">🧑‍🏫 선생님</div>
    <p class="sub" id="tAuthSub">이메일로 로그인해요</p>
    <div class="seg">
      <button id="segLogin" class="segbtn on" onclick="teacherMode('login')">로그인</button>
      <button id="segSignup" class="segbtn" onclick="teacherMode('signup')">회원가입</button>
    </div>
    <div class="card stack">
      <div><label for="tEmail">이메일</label><input id="tEmail" type="email" autocomplete="username" /></div>
      <div><label for="tPass">비밀번호</label><input id="tPass" type="password" autocomplete="current-password" /></div>
      <button id="tSubmit" class="btn big" onclick="teacherSubmit()">로그인</button>
      <div id="tLoginMsg" class="msg"></div>
    </div>
  </section>

  <section id="teacherHome" class="hidden">
    <div class="backbar">
      <div class="brand" style="font-size:26px; margin:0">🧑‍🏫 관리실</div>
      <button class="link" onclick="logoutTeacher()">로그아웃</button>
    </div>
    <div id="tBody" class="stack"></div>
  </section>

</div>

<script type="module">
/* ==================================================================
   1) 설정 — Firebase 콘솔 > 프로젝트 설정 > 내 앱(웹) 에서 복사해 넣으세요
   ================================================================== */
const firebaseConfig = {
  apiKey:            "AIzaSyALHkbiLtnnpO_lIsabgkTuc7DNvBk36Cc",
  authDomain:        "secretfriend-321b1.firebaseapp.com",
  projectId:         "secretfriend-321b1",
  storageBucket:     "secretfriend-321b1.firebasestorage.app",
  messagingSenderId: "845679896412",
  appId:             "1:845679896412:web:ebc8a2dfb28b8165858399"
};

/* ==================================================================
   2) 미션 카드 목록 (자유롭게 수정하세요)
   ================================================================== */
const MISSIONS = [
  "오늘 비밀친구에게 칭찬 한마디 해주기",
  "비밀친구의 좋은 점을 쪽지에 적어 몰래 놓아두기",
  "비밀친구가 웃도록 재미있는 이야기 들려주기",
  "비밀친구가 도움이 필요한지 살펴보기",
  "비밀친구에게 아침에 밝게 인사하기",
  "비밀친구의 이야기를 끝까지 잘 들어주기",
  "쉬는 시간에 비밀친구에게 같이 놀자고 하기",
  "비밀친구에게 고마웠던 일을 떠올려 전하기",
];

/* ================================================================== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc,
  updateDoc, deleteDoc, query, where, orderBy, writeBatch, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const READY = firebaseConfig.apiKey.startsWith("AIza");
let auth = null, db = null;
if (READY) {
  const app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db   = getFirestore(app);
}

let student = null;                       // { code, name, classId, ... }
let tState  = { classId:null, cls:null, viewRound:0, maxRound:0 };

/* ---------- 공통 ---------- */
const SCREENS = ["setup","landing","studentLogin","studentHome","teacherLogin","teacherHome"];
function show(id){
  SCREENS.forEach(s => document.getElementById(s).classList.toggle("hidden", s !== id));
  document.getElementById("app").classList.toggle("wide", id === "teacherHome");
  window.scrollTo(0,0);
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function jsEsc(s){ return String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'"); }

const CODE_WORDS = ["호랑이","토끼","사자","여우","곰","판다","다람쥐","코끼리","기린","펭귄","고래","강아지","고양이","병아리","부엉이","사과","딸기","포도","수박","바나나","참외","복숭아","귤","망고","체리","배","감","키위","레몬","멜론"];
function genCode(){
  const w = CODE_WORDS[Math.floor(Math.random()*CODE_WORDS.length)];
  return w + String(Math.floor(Math.random()*100)).padStart(2,"0");
}

/* ================= 학생 ================= */
async function studentLogin(){
  const code = document.getElementById("stCode").value.trim();
  const msg = document.getElementById("stLoginMsg");
  msg.textContent = "";
  if(!code){ msg.textContent = "코드를 입력해 주세요"; return; }
  try{
    const snap = await getDoc(doc(db, "codes", code));
    if(!snap.exists()){ msg.textContent = "코드를 찾을 수 없어요"; return; }
    student = { code, ...snap.data() };
    renderStudentHome();
    show("studentHome");
  }catch(e){ msg.textContent = "들어갈 수 없어요. 잠시 후 다시 시도해 주세요"; }
}
function logoutStudent(){ student = null; document.getElementById("stCode").value=""; show("landing"); }

function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))|0; } return Math.abs(h); }
function todaysMission(){
  const now = new Date();
  const dayNum = Math.floor(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate())/86400000);
  const seed = hashStr(student && student.code ? student.code : "");
  return MISSIONS[(seed + dayNum) % MISSIONS.length];
}

function renderStudentHome(){
  document.getElementById("stHello").textContent = `안녕, ${student.name}! 👋`;
  const body = document.getElementById("stHomeBody");
  body.innerHTML = "";

  const drawCard = document.createElement("div");
  drawCard.className = "card center";
  drawCard.style.textAlign = "center";
  if(!(student.currentRound >= 1 && student.drawOpen)){
    drawCard.innerHTML = `<h3 style="font-size:22px">🌙 잠깐만 기다려요</h3>
      <p style="color:var(--muted); margin:10px 0 0">아직 뽑기 시간이 아니에요.<br/>선생님이 열어주면 비밀친구를 뽑을 수 있어요!</p>`;
  } else {
    drawCard.innerHTML = `<h3 style="font-size:22px">이번 라운드 비밀친구</h3>
      <div id="drawZone" style="margin-top:14px"></div>`;
  }
  body.appendChild(drawCard);

  if(student.currentRound >= 1){
    const mCard = document.createElement("div");
    mCard.className = "card";
    mCard.innerHTML = `<h3 style="font-size:20px">🎯 오늘의 나의 미션</h3>
      <div class="mission"><div class="text">${esc(todaysMission())}</div></div>`;
    body.appendChild(mCard);
  }

  const actCard = document.createElement("div");
  actCard.className = "card stack";
  actCard.innerHTML = `<h3 style="font-size:20px">✏️ 오늘 내가 한 일</h3>
    <textarea id="actNote" placeholder="비밀친구를 위해 무엇을 했는지 적어보세요"></textarea>
    <button class="btn" onclick="recordActivity()">기록 남기기</button>
    <div id="actMsg" class="msg"></div>`;
  body.appendChild(actCard);

  const extra = document.createElement("div");
  extra.className = "card stack";
  extra.innerHTML = `<button class="btn ghost" onclick="loadHistory()">📜 지난 비밀친구 보기</button>
    ${student.revealOpen ? `<button class="btn soft" onclick="loadReveal()">🎉 나의 비밀친구는 누구였을까?</button>` : ``}
    <div id="extraZone"></div>`;
  body.appendChild(extra);

  if(student.currentRound >= 1 && student.drawOpen){
    document.getElementById("drawZone").innerHTML =
      `<div class="note" id="note" onclick="doDraw()"><span class="seal">✉️</span><span class="tap">탭해서 확인!</span></div>`;
  }
}

let drawing = false;
async function doDraw(){
  if(drawing) return; drawing = true;
  const zone = document.getElementById("drawZone");
  const note = document.getElementById("note");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const draws = student.draws || {};
  const name = draws[String(student.currentRound)];
  if(!name){ zone.innerHTML = `<div class="msg err">아직 배정이 준비되지 않았어요</div>`; drawing=false; return; }

  const finish = () => {
    zone.innerHTML = `<div class="reveal-name">💝 ${esc(name)}</div>
      <p style="color:var(--muted); margin:8px 0 0">이제 ${esc(name)}의 비밀친구예요!</p>`;
    confetti(); drawing = false;
  };
  if(reduce){ finish(); return; }

  note.classList.add("shake");
  zone.insertAdjacentHTML("beforeend", `<div class="suspense" id="susp">두구두구</div>`);
  const susp = document.getElementById("susp");
  let dots = 0;
  const t = setInterval(()=>{ dots=(dots+1)%4; susp.textContent = "두구두구" + ".".repeat(dots); }, 250);
  setTimeout(()=>{ clearInterval(t); finish(); }, 1600);
}

function confetti(){
  const box = document.createElement("div"); box.className="confetti";
  const em = ["🎉","✨","🎈","💖","⭐","🎊"];
  for(let i=0;i<22;i++){
    const s = document.createElement("span");
    s.textContent = em[i%em.length];
    s.style.left = Math.random()*100 + "vw";
    s.style.animationDuration = (1.4 + Math.random()*1.4) + "s";
    s.style.animationDelay = (Math.random()*0.3) + "s";
    box.appendChild(s);
  }
  document.body.appendChild(box);
  setTimeout(()=>box.remove(), 3200);
}

async function recordActivity(){
  const note = document.getElementById("actNote").value.trim();
  const msg = document.getElementById("actMsg");
  msg.className="msg"; msg.textContent="";
  if(!note){ msg.className="msg err"; msg.textContent="내용을 적어 주세요"; return; }
  try{
    await addDoc(collection(db, "classes", student.classId, "activities"), {
      code: student.code,
      classId: student.classId,
      round: student.currentRound,
      giverId: student.studentId,
      giverName: student.name,
      note,
      createdAt: serverTimestamp()
    });
    document.getElementById("actNote").value="";
    msg.className="msg ok"; msg.textContent="기록했어요! 잘하고 있어요 💛";
  }catch(e){ msg.className="msg err"; msg.textContent="기록하지 못했어요. 다시 시도해 주세요"; }
}

async function loadHistory(){
  const zone = document.getElementById("extraZone");
  const snap = await getDoc(doc(db, "codes", student.code));
  const draws = snap.exists() ? (snap.data().draws || {}) : {};
  const rounds = Object.keys(draws).map(Number).sort((a,b)=>a-b);
  if(!rounds.length){ zone.innerHTML = `<div class="empty">아직 뽑은 기록이 없어요</div>`; return; }
  zone.innerHTML = `<div class="list">` + rounds.map(r =>
    `<div class="item"><span>${r}번째</span><span class="code" style="font-size:18px">${esc(draws[String(r)])}</span></div>`
  ).join("") + `</div>`;
}

async function loadReveal(){
  const zone = document.getElementById("extraZone");
  const snap = await getDoc(doc(db, "codes", student.code));
  const data = snap.exists() ? snap.data() : {};
  if(!data.revealOpen){ zone.innerHTML = `<div class="empty">아직 대공개 시간이 아니에요</div>`; return; }
  const received = data.received || {};
  const rounds = Object.keys(received).map(Number).sort((a,b)=>a-b);
  if(!rounds.length){ zone.innerHTML = `<div class="empty">아직 공개할 내용이 없어요</div>`; return; }
  zone.innerHTML = `<div class="list">` + rounds.map(r =>
    `<div class="item"><span>${r}번째 나의 비밀친구</span><span class="code" style="font-size:18px">💌 ${esc(received[String(r)])}</span></div>`
  ).join("") + `</div>`;
  confetti();
}

let teacherAuthMode = "login";
function teacherMode(m){
  teacherAuthMode = m;
  document.getElementById("segLogin").classList.toggle("on", m==="login");
  document.getElementById("segSignup").classList.toggle("on", m==="signup");
  document.getElementById("tSubmit").textContent = m==="signup" ? "회원가입" : "로그인";
  document.getElementById("tAuthSub").textContent = m==="signup" ? "계정을 만들어요" : "이메일로 로그인해요";
  const msg = document.getElementById("tLoginMsg"); msg.className="msg"; msg.textContent="";
}
function teacherSubmit(){ teacherAuthMode==="signup" ? teacherSignup() : teacherLogin(); }

async function teacherLogin(){
  const email = document.getElementById("tEmail").value.trim();
  const pass  = document.getElementById("tPass").value;
  const msg = document.getElementById("tLoginMsg"); msg.className="msg"; msg.textContent="";
  try{
    await signInWithEmailAndPassword(auth, email, pass);
    await renderTeacherHome(); show("teacherHome");
  }catch(e){ msg.className="msg err"; msg.textContent="로그인 실패: 이메일/비밀번호를 확인하세요"; }
}
async function teacherSignup(){
  const email = document.getElementById("tEmail").value.trim();
  const pass  = document.getElementById("tPass").value;
  const msg = document.getElementById("tLoginMsg"); msg.className="msg"; msg.textContent="";
  if(!email || !pass){ msg.className="msg err"; msg.textContent="이메일과 비밀번호를 입력하세요"; return; }
  if(pass.length < 6){ msg.className="msg err"; msg.textContent="비밀번호는 6자 이상으로 정하세요"; return; }
  try{
    await createUserWithEmailAndPassword(auth, email, pass);
    await renderTeacherHome(); show("teacherHome");
  }catch(e){
    msg.className="msg err";
    msg.textContent = (e.code === "auth/email-already-in-use")
      ? "이미 가입된 이메일이에요. 로그인해 주세요" : "가입에 실패했어요. 다시 시도해 주세요";
  }
}
async function logoutTeacher(){ await signOut(auth); tState={classId:null,cls:null,viewRound:0,maxRound:0}; show("landing"); }

async function renderTeacherHome(){
  const qs = await getDocs(query(collection(db,"classes"), where("teacherId","==", auth.currentUser.uid)));
  const classes = qs.docs.map(d => ({ id:d.id, ...d.data() }));
  const body = document.getElementById("tBody");
  body.innerHTML = `<div class="card stack">
    <label>학급 선택</label>
    <div class="list">` +
    (classes.length ? classes.map(c =>
      `<div class="item"><span>${esc(c.name)} <span class="pill ${c.drawOpen?'on':'off'}">${c.drawOpen?'뽑기 열림':'닫힘'}</span></span>
       <button class="btn mini ghost" onclick="openClass('${c.id}')">열기</button></div>`).join("")
      : `<div class="empty">아직 학급이 없어요. 아래에서 만들어 보세요.</div>`) +
    `</div>
    <div class="row">
      <input id="newClass" placeholder="새 학급 이름 (예: 3학년 2반)" style="flex:2" />
      <button class="btn" style="flex:1" onclick="createClass()">만들기</button>
    </div>

async function createClass(){
  const name = document.getElementById("newClass").value.trim();
  const msg = document.getElementById("tHeadMsg");
  if(!name){ msg.className="msg err"; msg.textContent="학급 이름을 입력하세요"; return; }
  try{
    const ref = await addDoc(collection(db,"classes"), {
      teacherId: auth.currentUser.uid, name,
      currentRound: 0, drawOpen: false, revealOpen: false, createdAt: serverTimestamp()
    });
    tState.classId = ref.id;
    await renderTeacherHome();
  }catch(e){ msg.className="msg err"; msg.textContent="만들지 못했어요"; }
}

async function openClass(id){
  tState.classId = id;
  const cSnap = await getDoc(doc(db,"classes",id));
  const cls = { id, ...cSnap.data() };
  tState.cls = cls;
  tState.viewRound = cls.currentRound;
  tState.maxRound  = cls.currentRound;

  const sSnap = await getDocs(collection(db,"classes",id,"students"));
  const students = sSnap.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>a.name.localeCompare(b.name,"ko"));

  document.getElementById("classDetail").innerHTML = `
    <div class="card stack">
      <div class="backbar"><h3 style="font-size:22px">${esc(cls.name)}</h3><span>라운드 <b>${cls.currentRound}</b></span></div>
      <div class="row">
        <span>뽑기 <span class="pill ${cls.drawOpen?'on':'off'}">${cls.drawOpen?'열림':'닫힘'}</span></span>
        <span>대공개 <span class="pill ${cls.revealOpen?'on':'off'}">${cls.revealOpen?'열림':'닫힘'}</span></span>
      </div>
      <div class="row">
        <button class="btn soft" onclick="newRound('${id}')">🎲 새 라운드 배정</button>
        <button class="btn ${cls.drawOpen?'line':'ghost'}" onclick="toggleDraw('${id}',${!cls.drawOpen})">${cls.drawOpen?'뽑기 닫기':'뽑기 열기'}</button>
      </div>
      <div class="row">
        <button class="btn ${cls.revealOpen?'line':'ghost'}" onclick="toggleReveal('${id}',${!cls.revealOpen})">${cls.revealOpen?'대공개 닫기':'대공개 열기'}</button>
        <button class="btn line" onclick="resetClass('${id}')">전체 초기화</button>
      </div>
      <div id="ctrlMsg" class="msg"></div>
    </div>

    <div class="card stack">
      <h3 style="font-size:20px">👧 학생 & 코드 <span style="font-weight:400;color:var(--muted);font-size:13px">(쪽지로 나눠주세요)</span></h3>
      <div class="list">` +
      (students.length ? students.map(s =>
        `<div class="item"><span>${esc(s.name)}</span>
          <span style="display:flex; align-items:center; gap:12px">
            <span class="code">${esc(s.code)}</span>
            <button class="btn mini line" style="color:var(--danger); border-color:#F3D2E0" onclick="deleteStudent('${s.id}','${jsEsc(s.code)}','${jsEsc(s.name)}')">삭제</button>
          </span></div>`).join("")
        : `<div class="empty">아직 학생이 없어요</div>`) + `</div>
      <label style="margin-top:6px">학생 추가 (한 줄에 한 명)</label>
      <textarea id="newNames" placeholder="김하늘&#10;이바다&#10;박별"></textarea>
      <button class="btn" onclick="addStudents('${id}')">명단 추가하고 코드 발급</button>
      <div id="addMsg" class="msg"></div>
    </div>

    <div class="card stack">
      <div class="backbar" style="margin-bottom:0">
        <h3 style="font-size:20px">🔎 배정 <span style="font-weight:400;color:var(--muted);font-size:13px">(선생님만 보여요)</span></h3>
        <div style="display:flex; gap:6px; align-items:center">
          <button class="btn mini line" onclick="changeViewRound(-1)">◀</button>
          <span id="viewRoundLabel" style="min-width:66px; text-align:center; font-weight:700">${cls.currentRound>=1?cls.currentRound+"라운드":"아직 없음"}</span>
          <button class="btn mini line" onclick="changeViewRound(1)">▶</button>
        </div>
      </div>
      <div id="assignZone"><div class="empty">불러오는 중…</div></div>
    </div>

    <div class="card stack">
      <h3 style="font-size:20px">🏆 열심히 한 친구 <span id="rankRoundLabel" style="font-weight:400;color:var(--muted);font-size:13px"></span></h3>
      <div id="rankZone"><div class="empty">불러오는 중…</div></div>
    </div>

    <div class="card stack">
      <h3 style="font-size:20px">📝 아이들이 남긴 기록</h3>
      <div id="notesZone"><div class="empty">불러오는 중…</div></div>
    </div>`;

  loadAssignments(id, tState.viewRound);
  loadRanking(id, tState.viewRound);

async function addStudents(id){
  const raw = document.getElementById("newNames").value;
  const names = raw.split("\n").map(s=>s.trim()).filter(Boolean);
  const msg = document.getElementById("addMsg");
  if(!names.length){ msg.className="msg err"; msg.textContent="이름을 입력하세요"; return; }
  msg.className="msg"; msg.textContent="추가하는 중…";
  const cls = tState.cls;
  try{
    for(const name of names){
      let code = null;
      for(let i=0;i<25;i++){
        const c = genCode();
        const exists = await getDoc(doc(db,"codes",c));
        if(!exists.exists()){ code = c; break; }
      }
      if(!code){ msg.className="msg err"; msg.textContent="코드 생성에 실패했어요"; return; }
      const sRef = doc(collection(db,"classes",id,"students"));
      const batch = writeBatch(db);
      batch.set(sRef, { name, code, createdAt: serverTimestamp() });
      batch.set(doc(db,"codes",code), {
        classId: id, studentId: sRef.id, name,
        currentRound: cls.currentRound, drawOpen: cls.drawOpen, revealOpen: cls.revealOpen,
        draws: {}, received: {}
      });
      await batch.commit();
    }
    document.getElementById("newNames").value="";
    await openClass(id);
  }catch(e){ msg.className="msg err"; msg.textContent="추가하지 못했어요"; }
}

async function deleteStudent(sid, code, name){
  if(!confirm(`'${name}' 학생을 삭제할까요?\n이 학생의 코드도 함께 사라져요.`)) return;
  try{
    const batch = writeBatch(db);
    batch.delete(doc(db,"classes",tState.classId,"students",sid));
    batch.delete(doc(db,"codes",code));
    await batch.commit();
    await openClass(tState.classId);
  }catch(e){ alert("삭제하지 못했어요"); }
}

async function newRound(id){
  const msg = document.getElementById("ctrlMsg");
  msg.className="msg"; msg.textContent="배정하는 중…";
  try{
    const sSnap = await getDocs(collection(db,"classes",id,"students"));
    const students = sSnap.docs.map(d=>({id:d.id, ...d.data()}));
    if(students.length < 2){ msg.className="msg err"; msg.textContent="학생이 최소 2명 필요해요"; return; }

    const round = tState.cls.currentRound + 1;

    // 지난 라운드 짝 (겹침 방지용)
    let prev = new Set();
    if(round > 1){
      const aSnap = await getDocs(query(collection(db,"classes",id,"assignments"), where("round","==", round-1)));
      aSnap.docs.forEach(d => prev.add(d.data().giverId + ">" + d.data().receiverId));
    }

    // 무작위로 한 줄 세워 옆으로 넘기는 순환 배정 → 모두가 챙기고 챙김받음
    let order = null;
    for(let attempt=0; attempt<100; attempt++){
      const arr = students.slice().sort(()=>Math.random()-0.5);
      const ok = arr.every((s,i) => !prev.has(s.id + ">" + arr[(i+1)%arr.length].id));
      if(ok || attempt===99){ order = arr; if(ok) break; }
    }

    const batch = writeBatch(db);
    order.forEach((g,i) => {
      const r = order[(i+1)%order.length];
      batch.set(doc(collection(db,"classes",id,"assignments")), {
        round, giverId:g.id, giverName:g.name, receiverId:r.id, receiverName:r.name
      });
      batch.update(doc(db,"codes",g.code), {
        currentRound: round, drawOpen: true, revealOpen: false,
        [`draws.${round}`]: r.name, received: {}
      });
    });
    batch.update(doc(db,"classes",id), { currentRound: round, drawOpen: true, revealOpen: false });
    await batch.commit();
    await openClass(id);
  }catch(e){ msg.className="msg err"; msg.textContent="배정하지 못했어요"; }
}

async function toggleDraw(id, open){
  try{
    const sSnap = await getDocs(collection(db,"classes",id,"students"));
    const batch = writeBatch(db);
    batch.update(doc(db,"classes",id), { drawOpen: open });
    sSnap.docs.forEach(d => batch.update(doc(db,"codes",d.data().code), { drawOpen: open }));
    await batch.commit();
    await openClass(id);
  }catch(e){ alert("변경하지 못했어요"); }
}

async function toggleReveal(id, open){
  try{
    const sSnap = await getDocs(collection(db,"classes",id,"students"));
    const students = sSnap.docs.map(d=>({id:d.id, ...d.data()}));
    const codeById = {}; students.forEach(s => codeById[s.id] = s.code);

    const batch = writeBatch(db);
    batch.update(doc(db,"classes",id), { revealOpen: open });

    if(open){
      // 각 학생에게 '누가 나를 챙겼는지'를 지금 처음 기록해 줌
      const aSnap = await getDocs(collection(db,"classes",id,"assignments"));
      const received = {};
      aSnap.docs.forEach(d => {
        const a = d.data();
        received[a.receiverId] = received[a.receiverId] || {};
        received[a.receiverId][a.round] = a.giverName;
      });
      students.forEach(s => batch.update(doc(db,"codes",s.code), {
        revealOpen: true, received: received[s.id] || {}
      }));
    } else {
      students.forEach(s => batch.update(doc(db,"codes",s.code), { revealOpen: false, received: {} }));
    }
    await batch.commit();
    await openClass(id);
  }catch(e){ alert("변경하지 못했어요"); }
}

async function resetClass(id){
  if(!confirm("모든 배정과 활동 기록이 지워지고 라운드가 0으로 돌아갑니다. 계속할까요?")) return;
  try{
    const [aSnap, actSnap, sSnap] = await Promise.all([
      getDocs(collection(db,"classes",id,"assignments")),
      getDocs(collection(db,"classes",id,"activities")),
      getDocs(collection(db,"classes",id,"students"))
    ]);
    const batch = writeBatch(db);
    aSnap.docs.forEach(d => batch.delete(d.ref));
    actSnap.docs.forEach(d => batch.delete(d.ref));
    sSnap.docs.forEach(d => batch.update(doc(db,"codes",d.data().code), {
      currentRound: 0, drawOpen: false, revealOpen: false, draws: {}, received: {}
    }));
    batch.update(doc(db,"classes",id), { currentRound: 0, drawOpen: false, revealOpen: false });
    await batch.commit();
    await openClass(id);
  }catch(e){ alert("초기화하지 못했어요"); }
}

function changeViewRound(delta){
  const next = (tState.viewRound || 0) + delta;
  if(next < 1 || next > (tState.maxRound || 0)) return;
  tState.viewRound = next;
  document.getElementById("viewRoundLabel").textContent = next + "라운드";
  loadAssignments(tState.classId, next);
  loadRanking(tState.classId, next);
}

async function loadAssignments(id, round){
  const zone = document.getElementById("assignZone");
  if(round < 1){ zone.innerHTML = `<div class="empty">아직 배정 전이에요. 새 라운드를 시작하세요.</div>`; return; }
  try{
    const snap = await getDocs(query(collection(db,"classes",id,"assignments"), where("round","==",round)));
    const rows = snap.docs.map(d=>d.data()).sort((a,b)=>a.giverName.localeCompare(b.giverName,"ko"));
    if(!rows.length){ zone.innerHTML = `<div class="empty">배정이 없어요</div>`; return; }
    zone.innerHTML = `<div class="list">` + rows.map(r =>
      `<div class="item"><span>${esc(r.giverName)}</span><span class="arrow">→ ${esc(r.receiverName)}</span></div>`
    ).join("") + `</div>`;
  }catch(e){ zone.innerHTML = `<div class="empty">불러오지 못했어요</div>`; }
}

async function loadRanking(id, round){
  const zone = document.getElementById("rankZone");
  const label = document.getElementById("rankRoundLabel");
  if(label) label.textContent = round >= 1 ? `(${round}라운드)` : "";
  if(round < 1){ zone.innerHTML = `<div class="empty">아직 라운드가 없어요</div>`; return; }
  try{
    const snap = await getDocs(query(collection(db,"classes",id,"activities"), where("round","==",round)));
    const count = {};
    snap.docs.forEach(d => { const a=d.data(); count[a.giverName] = (count[a.giverName]||0)+1; });
    const rows = Object.entries(count).sort((a,b)=>b[1]-a[1]);
    if(!rows.length){ zone.innerHTML = `<div class="empty">이 라운드엔 아직 기록이 없어요</div>`; return; }
    zone.innerHTML = `<div class="list">` + rows.map(([name,c],i) =>
      `<div class="item"><span><span class="rank">${i+1}</span> ${esc(name)}</span><span>${c}회</span></div>`
    ).join("") + `</div>`;
  }catch(e){ zone.innerHTML = `<div class="empty">불러오지 못했어요</div>`; }
}

async function loadActivityNotes(id){
  const zone = document.getElementById("notesZone");
  try{
    const snap = await getDocs(query(collection(db,"classes",id,"activities"), orderBy("createdAt","desc")));
    const rows = snap.docs.map(d=>d.data());
    if(!rows.length){ zone.innerHTML = `<div class="empty">아직 남긴 기록이 없어요</div>`; return; }
    zone.innerHTML = `<div class="list">` + rows.map(r => {
      const d = r.createdAt && r.createdAt.toDate ? r.createdAt.toDate() : null;
      const when = d ? `${d.getMonth()+1}/${d.getDate()}` : "";
      return `<div class="item" style="flex-direction:column; align-items:stretch; gap:4px">
        <div style="display:flex; justify-content:space-between">
          <b>${esc(r.giverName)}</b>
          <span style="color:var(--muted); font-size:13px">${r.round}라운드 · ${when}</span>
        </div>
        <div>${esc(r.note)}</div>
      </div>`;
    }).join("") + `</div>`;
  }catch(e){ zone.innerHTML = `<div class="empty">불러오지 못했어요</div>`; }
}
